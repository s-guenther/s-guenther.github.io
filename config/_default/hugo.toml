# -- Site configuration --
# Theme documentation: https://blowfish.page/docs/configuration/

theme = "blowfish"
baseURL = "https://www.sgrse.de/"  # must match static/CNAME

# German is the main language and lives at the root (/), English at /en/.
defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
summaryLength = 0
buildDrafts = false
buildFuture = false
enableEmoji = false

# No blog: switch off tags, categories and other taxonomy pages.
disableKinds = ["taxonomy", "term", "rss"]

[pagination]
  pagerSize = 100

[imaging]
  anchor = "Center"

[taxonomies]

[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML"]
  section = ["HTML"]
