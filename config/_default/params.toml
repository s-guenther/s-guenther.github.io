# -- Theme options --
# Only options that differ from the theme defaults or matter for this site.
# Full list: themes/blowfish/config/_default/params.toml
# Documentation: https://blowfish.page/docs/configuration/#theme-parameters

colorScheme = "sgrse"           # assets/css/schemes/sgrse.css (logo colours)
defaultAppearance = "light"
autoSwitchAppearance = true     # follow the visitor's light/dark setting

enableSearch = false
disableImageZoom = true         # no click-to-enlarge (it caught clicks on linked tiles)
enableCodeCopy = false
disableTextInHeader = true      # the logo already shows "sgrse"
logo = "img/logo-white.svg"   # header bar is always teal
defaultSocialImage = "img/logo.svg"
tagline = "research • software • engineering"   # shown in the footer

# Keep visitors on the language they chose; no automatic redirect.
[languageRedirect]
  enabled = false

[header]
  layout = "fixed-fill"          # overridden: layouts/partials/header/fixed-fill.html

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "page"               # plain Markdown page (content/_index.*.md)
  showRecent = false

[article]
  showDate = false
  showAuthor = false
  showHero = true
  heroStyle = "basic"
  showBreadcrumbs = false
  showDraftLabel = true
  showEdit = false
  showHeadingAnchors = false
  showPagination = false
  showReadingTime = false
  showTableOfContents = false
  showTaxonomies = false
  showWordCount = false
  showRelatedContent = false
  showZenMode = false

[list]
  showHero = false
  showBreadcrumbs = false
  showSummary = true
  showTableOfContents = false
  showCards = false
  orderByWeight = true
  groupByYear = false
  cardView = false
